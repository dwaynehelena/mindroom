<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Foundry — Marketplace</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #181b24;
      --border: #2a2f3d;
      --text: #e6e8ee;
      --muted: #9aa0b0;
      --accent: #4f8cff;
      --green: #34c08b;
      --red: #e05b5b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    header h1 { font-size: 18px; margin: 0; }
    nav { display: flex; gap: 8px; }
    nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; }
    nav a.active { color: var(--text); background: var(--panel); border: 1px solid var(--border); }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    input[type="search"] {
      flex: 1; min-width: 220px; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
    }
    button {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); cursor: pointer; font-size: 13px;
    }
    button:hover { border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .card h3 { margin: 0; font-size: 16px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
    .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { background: #232838; padding: 2px 8px; border-radius: 10px; }
    .card-actions { display: flex; gap: 8px; margin-top: 8px; }
    .badge { padding: 3px 8px; border-radius: 8px; font-size: 12px; }
    .installed { background: rgba(52,192,139,.15); color: var(--green); }
    .available { background: rgba(79,140,255,.15); color: var(--accent); }
    .detail { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .detail h2 { margin-top: 0; }
    .deps { margin-top: 12px; }
    .deps ul { margin: 4px 0 0 20px; }
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--panel); border: 1px solid var(--border); padding: 10px 18px;
      border-radius: 8px; opacity: 0; transition: opacity .2s; font-size: 14px;
    }
    #toast.show { opacity: 1; }
    pre { background: #10131b; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>🛠️ Skill Foundry</h1>
    <nav>
      <a href="#/" data-route="browse" id="nav-browse">Browse</a>
      <a href="#/installed" data-route="installed" id="nav-installed">Installed</a>
    </nav>
  </header>
  <main id="view"></main>
  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
